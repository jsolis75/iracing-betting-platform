name: Build Broadcaster

# Builds iRacingBroadcaster.exe automatically whenever the broadcaster
# code changes (or when run manually from the Actions tab), and publishes
# it to a GitHub Release with a permanent download link:
#
#   https://github.com/jsolis75/iracing-betting-platform/releases/download/broadcaster-latest/iRacingBroadcaster.exe

on:
  push:
    branches: [main, master]
    paths:
      - 'broadcaster-csharp/**'
      - '.github/workflows/build-broadcaster.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: dotnet publish broadcaster-csharp/iRacingBroadcaster.csproj -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRacingBroadcaster
          path: broadcaster-csharp/bin/Release/net8.0/win-x64/publish/iRacingBroadcaster.exe

      - name: Publish to "broadcaster-latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create broadcaster-latest \
            --title "iRacing Broadcaster (latest)" \
            --notes "Always-current build of the telemetry broadcaster. Download iRacingBroadcaster.exe below, double-click it, and join an iRacing session." \
            || true
          gh release upload broadcaster-latest \
            broadcaster-csharp/bin/Release/net8.0/win-x64/publish/iRacingBroadcaster.exe \
            --clobber
